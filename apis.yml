name: TradeLink
description: TradeLink is a Munich-based logistics SaaS company building the first collaboration
  platform for supply chain and inbound/outbound logistics. Its cloud software gives warehouses,
  suppliers, carriers, and dispatchers a shared system for time-slot (dock) booking, dock and
  yard management, load-carrier and empties management, driver check-in terminals, and analytics
  insights, replacing phone and email coordination with real-time, transparent workflows. TradeLink
  integrates with existing ERP and transport-management systems and serves production, retail, and
  contract-logistics companies across the DACH region and Europe, with customers including MAN, SPAR,
  Liebherr, and Emons. It is backed by Insight Partners and Point Nine.
